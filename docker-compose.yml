# Central de Gestão + conector fiscal
# No Easypanel: crie um serviço "App" para cada pasta (gestao e fiscal) OU use um serviço "Compose" com este arquivo.
services:
  gestao:
    build: ./gestao
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      FISCAL_URL: http://fiscal:8000
      FISCAL_TOKEN: ${FISCAL_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SOLIDES_TOKEN: ${SOLIDES_TOKEN:-}
      SOLIDES_INTERVALO_MIN: ${SOLIDES_INTERVALO_MIN:-15}
      SOLIDES_DIAS_INICIAIS: ${SOLIDES_DIAS_INICIAIS:-35}
      BB_CLIENT_ID: ${BB_CLIENT_ID:-}
      BB_CLIENT_SECRET: ${BB_CLIENT_SECRET:-}
      BB_APP_KEY: ${BB_APP_KEY:-}
      BB_CERT_PATH: ${BB_CERT_PATH:-}
      BB_CERT_SENHA: ${BB_CERT_SENHA:-}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      BANCOS_INTERVALO_MIN: ${BANCOS_INTERVALO_MIN:-180}
    volumes:
      - gestao-dados:/data
      - /opt/central/certs:/certs:ro
    # sem "ports": o Easypanel publica o serviço pelo domínio (HTTPS). Para testar fora do Easypanel use "127.0.0.1:3001:3000".
    expose:
      - "3000"
    depends_on:
      - fiscal

  fiscal:
    build: ./fiscal
    restart: unless-stopped
    environment:
      CNPJ: ${CNPJ}
      UF: ${UF:-SP}
      AMBIENTE: ${AMBIENTE:-2}
      CERT_PATH: /certs/certificado.pfx
      CERT_SENHA: ${CERT_SENHA}
      FISCAL_TOKEN: ${FISCAL_TOKEN}
      INTERVALO_MIN: ${INTERVALO_MIN:-60}
      AUTO_CIENCIA: ${AUTO_CIENCIA:-1}
      NFSE_ADN: ${NFSE_ADN:-1}
    volumes:
      - fiscal-dados:/data
      - /opt/central/certs:/certs:ro
    # sem "ports": o conector fica só na rede interna, acessível apenas pelo serviço gestao

volumes:
  gestao-dados:
  fiscal-dados:
